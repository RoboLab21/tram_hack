# Конфигурация параметров резервной одометрии беспилотного трамвая (пакет solution)

# -----------------------------------------------------------------------------
# 1. Нода оценки скорости вагона (VelocityNode) -> топик /result/velocity
# -----------------------------------------------------------------------------
velocity_node:
  ros__parameters:
    input_in_kmh: true                  # Входная скорость с колесных датчиков задана в км/ч (true) или м/с (false)
    integration_method: "trapezoidal"   # Численное интегрирование: "trapezoidal" (трапеции) или "rectangular" (Эйлер)
    velocity_filter: "mean"             # Фильтрация скорости: "mean" (мгновенное среднее), "ema" или "sma"
    enable_brake_filter: true           # Фильтр отсечки ползучего шума остановки и защита от юза (driver_cmd < 0)
    enable_curve_compensation: true     # Геометрическая компенсация забегания колес в кривых
    child_frame_id: "base_link"         # Базовый фрейм транспортного средства

# -----------------------------------------------------------------------------
# 2. Нода 3D позиционирования (PositionNode) -> топик /result/position
# -----------------------------------------------------------------------------
position_node:
  ros__parameters:
    frame_id: "map"                     # Имя глобальной системы координат (map)
    child_frame_id: "base_link"         # Базовый фрейм транспортного средства
    enable_gnss_drift_correction: false # Коррекция продольного дрейфа по GNSS в процессе движения (false = отключено)

